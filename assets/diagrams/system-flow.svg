<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">嘉嘉商城系统架构与调用流程图</title>
  <desc id="desc">用户请求经 Gateway 分为普通业务和 AI 请求。Java 微服务负责交易事实与数据访问，Python agent-service 通过 HTTP 工具调用 Java 服务；商品变更经 RabbitMQ 同步到 Elasticsearch，RAG 使用 LangChain、百炼模型与 Qdrant，Seata、Nacos、Sentinel 提供治理能力。</desc>
  <defs>
    <marker id="arrow-gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#475467"/></marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#175cd3"/></marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#7f56d9"/></marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#dc6803"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#101828" flood-opacity=".08"/></filter>
    <style>
      .title{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#101828}.muted{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#667085}.label{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#475467;font-size:15px}.small{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#667085;font-size:14px}.node-title{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#101828;font-size:25px;font-weight:700}.node-text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#475467;font-size:16px}.tag{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:13px;font-weight:700;letter-spacing:1px}
    </style>
  </defs>

  <rect width="1800" height="1120" fill="#fbfcfe"/>
  <text x="70" y="70" class="title" font-size="35" font-weight="700">嘉嘉商城 · 系统架构与真实调用流程</text>
  <text x="70" y="108" class="muted" font-size="18">交易事实始终由 Java 微服务维护；Python Agent 只负责理解、编排和调用受控工具，不直接访问业务数据库。</text>

  <!-- Flow legend -->
  <g transform="translate(70 145)">
    <rect width="1660" height="56" rx="10" fill="#fff" stroke="#d0d5dd"/>
    <circle cx="35" cy="28" r="15" fill="#eaf2ff"/><text x="35" y="33" text-anchor="middle" class="title" font-size="14" font-weight="700">1</text>
    <text x="61" y="34" class="label">用户请求</text>
    <path d="M195 28H230" stroke="#98a2b3" stroke-width="2" marker-end="url(#arrow-gray)"/>
    <circle cx="268" cy="28" r="15" fill="#eaf2ff"/><text x="268" y="33" text-anchor="middle" class="title" font-size="14" font-weight="700">2</text>
    <text x="294" y="34" class="label">网关鉴权与路由</text>
    <path d="M485 28H520" stroke="#98a2b3" stroke-width="2" marker-end="url(#arrow-gray)"/>
    <circle cx="558" cy="28" r="15" fill="#eaf2ff"/><text x="558" y="33" text-anchor="middle" class="title" font-size="14" font-weight="700">3</text>
    <text x="584" y="34" class="label">业务 / AI 分流</text>
    <path d="M750 28H785" stroke="#98a2b3" stroke-width="2" marker-end="url(#arrow-gray)"/>
    <circle cx="823" cy="28" r="15" fill="#eaf2ff"/><text x="823" y="33" text-anchor="middle" class="title" font-size="14" font-weight="700">4</text>
    <text x="849" y="34" class="label">工具、数据与知识检索</text>
    <path d="M1095 28H1130" stroke="#98a2b3" stroke-width="2" marker-end="url(#arrow-gray)"/>
    <circle cx="1168" cy="28" r="15" fill="#eaf2ff"/><text x="1168" y="33" text-anchor="middle" class="title" font-size="14" font-weight="700">5</text>
    <text x="1194" y="34" class="label">事务 / 消息 / 搜索同步</text>
    <path d="M1488 28H1523" stroke="#98a2b3" stroke-width="2" marker-end="url(#arrow-gray)"/>
    <circle cx="1561" cy="28" r="15" fill="#eaf2ff"/><text x="1561" y="33" text-anchor="middle" class="title" font-size="14" font-weight="700">6</text>
    <text x="1587" y="34" class="label">结果返回</text>
  </g>

  <!-- Main request path -->
  <text x="70" y="255" class="title" font-size="20" font-weight="700">请求入口与服务分流</text>
  <g filter="url(#shadow)">
    <rect x="70" y="285" width="250" height="130" rx="16" fill="#fff" stroke="#cfd8e5" stroke-width="2"/>
    <rect x="410" y="285" width="285" height="130" rx="16" fill="#fff" stroke="#ffb3c1" stroke-width="3"/>
    <rect x="820" y="250" width="445" height="190" rx="18" fill="#eff8ff" stroke="#84adff" stroke-width="3"/>
    <rect x="820" y="515" width="445" height="190" rx="18" fill="#f9f5ff" stroke="#d6bbfb" stroke-width="3"/>
  </g>
  <text x="105" y="327" class="tag" fill="#475467">用户侧</text><text x="105" y="370" class="node-title">Vue 3 商城前端</text><text x="105" y="397" class="node-text">HTTP 页面请求 / SSE 对话</text>
  <text x="445" y="327" class="tag" fill="#e31b54">网关层</text><text x="445" y="370" class="node-title">Spring Cloud Gateway</text><text x="445" y="397" class="node-text">JWT 鉴权 · 限流 · 服务路由</text>
  <text x="855" y="297" class="tag" fill="#175cd3">Java 业务服务</text><text x="855" y="341" class="node-title">user · item · cart · search</text><text x="855" y="376" class="node-title">trade · pay</text><text x="855" y="410" class="node-text">商品、用户、订单、支付等真实业务规则</text>
  <text x="855" y="562" class="tag" fill="#7f56d9">Python 智能服务</text><text x="855" y="606" class="node-title">agent-service</text><text x="855" y="638" class="node-text">LangGraph Supervisor · 多 Agent 编排</text><text x="855" y="670" class="node-text">搜索 · 推荐 · 试穿 · 客服 · 站内操作</text>

  <path d="M320 350H410" stroke="#475467" stroke-width="3" marker-end="url(#arrow-gray)"/>
  <path d="M695 350H820" stroke="#175cd3" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="757" y="329" text-anchor="middle" class="small">普通业务请求</text>
  <path d="M553 415V610H820" fill="none" stroke="#7f56d9" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <text x="625" y="588" class="small" fill="#7f56d9">AI 请求</text>
  <path d="M1042 515V440" stroke="#7f56d9" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <path d="M1080 440V515" stroke="#98a2b3" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-gray)"/>
  <text x="1105" y="487" class="small">受控 HTTP 工具调用 / 结果</text>

  <!-- Controlled infrastructure -->
  <text x="70" y="500" class="title" font-size="20" font-weight="700">服务治理（不参与业务数据存储）</text>
  <g filter="url(#shadow)">
    <rect x="70" y="535" width="290" height="170" rx="16" fill="#fff" stroke="#a6f4c5" stroke-width="3"/>
    <rect x="1360" y="285" width="370" height="155" rx="16" fill="#fff" stroke="#f9dbaf" stroke-width="3"/>
    <rect x="1360" y="515" width="370" height="190" rx="16" fill="#fff" stroke="#d6bbfb" stroke-width="3"/>
  </g>
  <text x="105" y="577" class="tag" fill="#039855">治理与注册</text><text x="105" y="619" class="node-title">Nacos · Sentinel</text><text x="105" y="651" class="node-text">注册发现 / 配置中心</text><text x="105" y="679" class="node-text">网关与接口流控、熔断</text>
  <text x="1395" y="327" class="tag" fill="#dc6803">事务协调</text><text x="1395" y="369" class="node-title">Seata Server</text><text x="1395" y="400" class="node-text">trade · pay · user 全局事务协调</text>
  <text x="1395" y="562" class="tag" fill="#7f56d9">模型与知识</text><text x="1395" y="606" class="node-title">百炼模型 · LangChain · Qdrant</text><text x="1395" y="638" class="node-text">LLM 推理 / RAG 文档检索</text><text x="1395" y="670" class="node-text">只存规则知识，不存实时订单事实</text>

  <path d="M360 620H480V470H820" fill="none" stroke="#039855" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-gray)"/>
  <path d="M360 620H480V610H820" fill="none" stroke="#039855" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-gray)"/>
  <text x="485" y="458" class="small">服务注册 / 配置推送 / 流控规则</text>
  <path d="M1265 345H1360" stroke="#dc6803" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-orange)"/>
  <text x="1280" y="328" class="small">全局事务</text>
  <path d="M1265 610H1360" stroke="#7f56d9" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <path d="M1360 650H1265" stroke="#98a2b3" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-gray)"/>
  <text x="1290" y="586" class="small">RAG / 模型调用</text>

  <!-- Data and async paths -->
  <text x="70" y="785" class="title" font-size="20" font-weight="700">业务数据、商品索引与可靠消息</text>
  <g filter="url(#shadow)">
    <rect x="70" y="825" width="290" height="190" rx="16" fill="#fff" stroke="#a6f4c5" stroke-width="3"/>
    <rect x="455" y="825" width="270" height="190" rx="16" fill="#fff" stroke="#b2ddff" stroke-width="3"/>
    <rect x="820" y="825" width="270" height="190" rx="16" fill="#fff" stroke="#f9dbaf" stroke-width="3"/>
    <rect x="1185" y="825" width="270" height="190" rx="16" fill="#fff" stroke="#84adff" stroke-width="3"/>
    <rect x="1550" y="825" width="180" height="190" rx="16" fill="#fff" stroke="#b2ddff" stroke-width="3"/>
  </g>
  <text x="105" y="868" class="tag" fill="#039855">业务事实</text><text x="105" y="910" class="node-title">MySQL</text><text x="105" y="943" class="node-text">用户、商品、订单、支付</text><text x="105" y="975" class="node-text">undo_log 分布式事务回滚</text>
  <text x="490" y="868" class="tag" fill="#1570ef">缓存</text><text x="490" y="910" class="node-title">Redis</text><text x="490" y="943" class="node-text">商品缓存 / 购物车 Hash</text><text x="490" y="975" class="node-text">缓存失效后回源 MySQL</text>
  <text x="855" y="868" class="tag" fill="#dc6803">异步事件</text><text x="855" y="910" class="node-title">RabbitMQ</text><text x="855" y="943" class="node-text">商品变更、支付、订单事件</text><text x="855" y="975" class="node-text">确认、重试、幂等消费</text>
  <text x="1220" y="868" class="tag" fill="#175cd3">搜索服务</text><text x="1220" y="910" class="node-title">search-service</text><text x="1220" y="943" class="node-text">监听商品变更事件</text><text x="1220" y="975" class="node-text">写入商品索引</text>
  <text x="1580" y="868" class="tag" fill="#1570ef">索引库</text><text x="1580" y="910" class="node-title">ES</text><text x="1580" y="943" class="node-text">IK 分词</text><text x="1580" y="975" class="node-text">检索 / 聚合</text>

  <path d="M930 440V760H215V825" fill="none" stroke="#175cd3" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M970 440V760H590V825" fill="none" stroke="#175cd3" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="500" y="745" class="small">Java 服务读写业务事实与缓存</text>
  <path d="M1120 440V760H955V825" fill="none" stroke="#dc6803" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <text x="1020" y="745" class="small">Item 商品变更事件</text>
  <path d="M1090 920H1185" stroke="#dc6803" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <text x="1138" y="900" text-anchor="middle" class="small">消费同步</text>
  <path d="M1455 920H1550" stroke="#175cd3" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="1503" y="900" text-anchor="middle" class="small">索引写入</text>

  <rect x="70" y="1055" width="1660" height="36" rx="9" fill="#101828"/>
  <text x="900" y="1079" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" fill="#fff">返回路径：Java 服务或 Agent 汇总真实结果 → Gateway → Vue 前端；支付、密码、提交订单等高风险操作始终由用户确认。</text>
</svg>
