<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">嘉嘉商城多智能体协作流程图</title>
  <desc id="desc">用户请求经过 LangGraph Supervisor 进行意图识别、上下文判断和安全校验，再调用搜索、推荐、知识库、试衣、购物车和导航智能体。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#667085"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#101828" flood-opacity=".08"/></filter>
  </defs>
  <rect width="1600" height="900" fill="#fbfcfe"/>
  <text x="80" y="78" font-family="Arial,Microsoft YaHei,sans-serif" font-size="34" font-weight="700" fill="#101828">Multi-Agent Collaboration</text>
  <text x="80" y="118" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" fill="#667085">LangGraph Supervisor 统一编排搜索、推荐、知识问答、试衣与商城操作</text>
  <rect x="80" y="190" width="280" height="140" rx="18" fill="#fff" stroke="#d0d5dd" stroke-width="2" filter="url(#shadow)"/>
  <text x="110" y="238" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" font-weight="700" fill="#667085">INPUT</text>
  <text x="110" y="280" font-family="Arial,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#101828">用户自然语言</text>
  <text x="110" y="310" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="#667085">单任务 / 复合需求</text>
  <path d="M360 260H520" stroke="#667085" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="520" y="150" width="480" height="220" rx="24" fill="#111827" filter="url(#shadow)"/>
  <text x="560" y="205" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" font-weight="700" fill="#98a2b3">SUPERVISOR</text>
  <text x="560" y="254" font-family="Arial,Microsoft YaHei,sans-serif" font-size="32" font-weight="700" fill="#fff">LangGraph 总调度 Agent</text>
  <text x="560" y="300" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17" fill="#d0d5dd">意图识别 · 会话上下文 · 任务拆解</text>
  <text x="560" y="330" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17" fill="#d0d5dd">权限判断 · 危险操作确认 · 结果汇总</text>
  <path d="M1000 260H1160" stroke="#667085" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1160" y="150" width="360" height="220" rx="24" fill="#eef4ff" stroke="#84adff" stroke-width="2"/>
  <text x="1200" y="205" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" font-weight="700" fill="#175cd3">MEMORY &amp; SAFETY</text>
  <text x="1200" y="252" font-family="Arial,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" fill="#101828">会话与安全边界</text>
  <text x="1200" y="294" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="#475467">Session History / User Context</text>
  <text x="1200" y="325" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="#475467">支付、密码、提交订单需用户确认</text>
  <path d="M760 370V470" stroke="#667085" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="800" y="425" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#667085">按意图路由，可串行或并行调用</text>
  <g font-family="Arial,Microsoft YaHei,sans-serif">
    <rect x="70" y="510" width="220" height="150" rx="18" fill="#fff" stroke="#b2ddff" stroke-width="3" filter="url(#shadow)"/><text x="105" y="555" font-size="14" font-weight="700" fill="#1570ef">SEARCH AGENT</text><text x="105" y="598" font-size="22" font-weight="700" fill="#101828">商品搜索</text><text x="105" y="630" font-size="15" fill="#667085">关键词、价格、分类</text>
    <rect x="330" y="510" width="220" height="150" rx="18" fill="#fff" stroke="#d6bbfb" stroke-width="3" filter="url(#shadow)"/><text x="365" y="555" font-size="14" font-weight="700" fill="#7f56d9">RECOMMEND AGENT</text><text x="365" y="598" font-size="22" font-weight="700" fill="#101828">个性推荐</text><text x="365" y="630" font-size="15" fill="#667085">浏览、收藏、购物车</text>
    <rect x="590" y="510" width="220" height="150" rx="18" fill="#fff" stroke="#b9e6fe" stroke-width="3" filter="url(#shadow)"/><text x="625" y="555" font-size="14" font-weight="700" fill="#088ab2">KNOWLEDGE AGENT</text><text x="625" y="598" font-size="22" font-weight="700" fill="#101828">知识客服</text><text x="625" y="630" font-size="15" fill="#667085">LangChain + RAG</text>
    <rect x="850" y="510" width="220" height="150" rx="18" fill="#fff" stroke="#f9dbaf" stroke-width="3" filter="url(#shadow)"/><text x="885" y="555" font-size="14" font-weight="700" fill="#dc6803">TRY-ON AGENT</text><text x="885" y="598" font-size="22" font-weight="700" fill="#101828">AI 试衣</text><text x="885" y="630" font-size="15" fill="#667085">图片校验、异步任务</text>
    <rect x="1110" y="510" width="180" height="150" rx="18" fill="#fff" stroke="#a6f4c5" stroke-width="3" filter="url(#shadow)"/><text x="1140" y="555" font-size="14" font-weight="700" fill="#039855">ACTION</text><text x="1140" y="598" font-size="22" font-weight="700" fill="#101828">商城操作</text><text x="1140" y="630" font-size="15" fill="#667085">收藏、加购、导航</text>
    <rect x="1330" y="510" width="200" height="150" rx="18" fill="#fff" stroke="#fecdca" stroke-width="3" filter="url(#shadow)"/><text x="1360" y="555" font-size="14" font-weight="700" fill="#d92d20">ORDER AGENT</text><text x="1360" y="598" font-size="22" font-weight="700" fill="#101828">订单查询</text><text x="1360" y="630" font-size="15" fill="#667085">订单、物流、状态</text>
  </g>
  <path d="M760 470V490M180 490H1430M180 490V510M440 490V510M700 490V510M960 490V510M1200 490V510M1430 490V510" fill="none" stroke="#98a2b3" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="280" y="750" width="1040" height="74" rx="16" fill="#fff" stroke="#d0d5dd"/>
  <text x="800" y="796" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" fill="#475467">统一输出：结构化商品结果 · 可解释推荐理由 · 用户可确认的下一步操作</text>
</svg>
